<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Micah Lloyd: programmer and volleyball player">
  <title>Micah Lloyd: programmer and volleyball player</title>
  <defs>
    <clipPath id="typed"><rect x="50" y="190" height="30" width="372"></rect></clipPath>
      </defs>

  <rect x="1" y="1" width="898" height="258" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- left: who you are -->
  <text x="50" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#656d76">// bump. set. deploy.</text>
  <text x="50" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#1f2328">Micah Lloyd</text>
  <text x="50" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#1e5fbf">programmer · volleyball player</text>

  <g clip-path="url(#typed)">
    <text x="50" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" textLength="368" lengthAdjust="spacing" fill="#1f2328"><tspan fill="#e3a008">$</tspan> git commit -m "kill down the line"</text>
  </g>
  <rect x="424" y="195" width="9" height="19" fill="#e3a008"></rect>

  <!-- scoreboard -->
  <rect x="736" y="22" width="130" height="28" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="801" y="41" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#1f2328">ME <tspan fill="#e3a008" font-weight="700">25</tspan> : 23 BUGS</text>

  <!-- court -->
  <polygon points="508,192 852,192 874,226 486,226" fill="#f6f8fa" stroke="#e3a008" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="655" y1="192" x2="705" y2="226" stroke="#e3a008" stroke-width="2"/>
  <!-- net: two posts, square mesh, top and bottom tape, antennas -->
  <line x1="655" y1="192" x2="655" y2="94.0" stroke="#656d76" stroke-width="3" stroke-linecap="round"/>
  <path d="M660.0,101.4 V139.4 M665.0,104.8 V142.8 M670.0,108.2 V146.2 M675.0,111.6 V149.6 M680.0,115.0 V153.0 M685.0,118.4 V156.4 M690.0,121.8 V159.8 M695.0,125.2 V163.2 M700.0,128.6 V166.6 M655,104.5 L705,138.5 M655,111.0 L705,145.0 M655,117.5 L705,151.5 M655,124.0 L705,158.0 M655,130.5 L705,164.5" fill="none" stroke="#656d76" stroke-width="0.8"/>
  <line x1="655" y1="136.0" x2="705" y2="170.0" stroke="#1f2328" stroke-width="1.5"/>
  <line x1="655" y1="98.0" x2="705" y2="132.0" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>
  <g stroke-width="2.5" stroke-linecap="butt">
    <line x1="658" y1="138.0" x2="658" y2="80.0" stroke="#ffffff"/><line x1="658" y1="138.0" x2="658" y2="80.0" stroke="#e5484d" stroke-dasharray="4 4"/>
    <line x1="702" y1="168.0" x2="702" y2="110.0" stroke="#ffffff"/><line x1="702" y1="168.0" x2="702" y2="110.0" stroke="#e5484d" stroke-dasharray="4 4"/>
  </g>
  <line x1="705" y1="226" x2="705" y2="128.0" stroke="#656d76" stroke-width="3.5" stroke-linecap="round"/>

  <!-- the two players -->
  <text x="535" y="204" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="64" font-weight="700" fill="#1e5fbf">{</text>
  <text x="825" y="204" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="64" font-weight="700" fill="#1e5fbf">}</text>

  <!-- the ball -->
  <g transform="translate(680,56)">
    <g>
        <circle r="14" fill="#f5c518" stroke="#1f2328" stroke-width="1.5"/>
        <g fill="none" stroke="#1e5fbf" stroke-width="2.2" stroke-linecap="round">
          <path d="M-13,-3 Q0,-10 13,-3"/>
          <path d="M-5,-12.5 Q3,0 -5,12.5"/>
          <path d="M7,-11.5 Q-4,2 9,10"/>
        </g>
    </g>
  </g>
</svg>
