<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Micah Lloyd: programmer and volleyball player">
  <title>Micah Lloyd: programmer and volleyball player</title>
  <defs>
    <clipPath id="typed"><rect x="50" y="190" height="30" width="372"></rect></clipPath>
    <pattern id="mesh" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0,0 L4,4 M4,0 L0,4" stroke="#8b949e" stroke-width="0.7"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- left: who you are -->
  <text x="50" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#8b949e">// bump. set. deploy.</text>
  <text x="50" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#e6edf3">Micah Lloyd</text>
  <text x="50" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#4c8dff">programmer · volleyball player</text>

  <g clip-path="url(#typed)">
    <text x="50" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" textLength="368" lengthAdjust="spacing" fill="#e6edf3"><tspan fill="#f5c518">$</tspan> git commit -m "kill down the line"</text>
  </g>
  <rect x="424" y="195" width="9" height="19" fill="#f5c518"></rect>

  <!-- scoreboard -->
  <rect x="736" y="22" width="130" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="801" y="41" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">ME <tspan fill="#f5c518" font-weight="700">25</tspan> : 23 BUGS</text>

  <!-- court -->
  <line x1="490" y1="212" x2="870" y2="212" stroke="#f5c518" stroke-width="3" stroke-linecap="round"/>
  <line x1="680" y1="212" x2="680" y2="110" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <rect x="674" y="112" width="12" height="46" fill="url(#mesh)" stroke="#8b949e" stroke-width="0.8"/>
  <line x1="673" y1="112" x2="687" y2="112" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>

  <!-- the two players -->
  <text x="535" y="198" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="64" font-weight="700" fill="#4c8dff">{</text>
  <text x="825" y="198" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="64" font-weight="700" fill="#4c8dff">}</text>

  <!-- the ball -->
  <g transform="translate(680,70)">
    <g>
        <circle r="14" fill="#f5c518" stroke="#0d1117" stroke-width="1.5"/>
        <g fill="none" stroke="#1e5fbf" stroke-width="2.2" stroke-linecap="round">
          <path d="M-13,-3 Q0,-10 13,-3"/>
          <path d="M-5,-12.5 Q3,0 -5,12.5"/>
          <path d="M7,-11.5 Q-4,2 9,10"/>
        </g>
    </g>
  </g>
</svg>
