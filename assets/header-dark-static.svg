<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Micah Lloyd: programmer and volleyball player">
  <title>Micah Lloyd: programmer and volleyball player</title>
  <defs>
    <clipPath id="typed"><rect x="65" y="190" height="30" width="310"></rect></clipPath>
      </defs>

  <!-- left: who you are -->
  <text x="65" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#8b949e">// bump. set. deploy.</text>
  <text x="65" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#e6edf3">Micah Lloyd</text>
  <text x="65" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#4c8dff">programmer · volleyball player</text>

  <g clip-path="url(#typed)">
    <text x="65" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" textLength="306" lengthAdjust="spacing" fill="#e6edf3"><tspan fill="#f5c518">$</tspan> git commit -m "Bounce Ball!"</text>
  </g>
  <rect x="377" y="195" width="9" height="19" fill="#f5c518"></rect>

  <!-- scoreboard -->
  <rect x="736" y="22" width="130" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="801" y="41" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">ME <tspan fill="#f5c518" font-weight="700">25</tspan> : 23 BUGS</text>

  <!-- court -->
  <polygon points="508,192 852,192 874,226 486,226" fill="#161b22" stroke="#f5c518" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="655" y1="192" x2="705" y2="226" stroke="#f5c518" stroke-width="2"/>
  <!-- net: two posts, square mesh, top and bottom tape, antennas -->
  <line x1="655" y1="192" x2="655" y2="94.0" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <path d="M660.0,101.4 V139.4 M665.0,104.8 V142.8 M670.0,108.2 V146.2 M675.0,111.6 V149.6 M680.0,115.0 V153.0 M685.0,118.4 V156.4 M690.0,121.8 V159.8 M695.0,125.2 V163.2 M700.0,128.6 V166.6 M655,104.5 L705,138.5 M655,111.0 L705,145.0 M655,117.5 L705,151.5 M655,124.0 L705,158.0 M655,130.5 L705,164.5" fill="none" stroke="#8b949e" stroke-width="0.8"/>
  <line x1="655" y1="136.0" x2="705" y2="170.0" stroke="#e6edf3" stroke-width="1.5"/>
  <line x1="655" y1="98.0" x2="705" y2="132.0" stroke="#e6edf3" stroke-width="4" stroke-linecap="round"/>
  <g stroke-width="2.5" stroke-linecap="butt">
    <line x1="658" y1="138.0" x2="658" y2="80.0" stroke="#ffffff"/><line x1="658" y1="138.0" x2="658" y2="80.0" stroke="#e5484d" stroke-dasharray="4 4"/>
    <line x1="702" y1="168.0" x2="702" y2="110.0" stroke="#ffffff"/><line x1="702" y1="168.0" x2="702" y2="110.0" stroke="#e5484d" stroke-dasharray="4 4"/>
  </g>
  <line x1="705" y1="226" x2="705" y2="128.0" stroke="#8b949e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- the two players -->
  <text x="535" y="204" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="64" font-weight="700" fill="#4c8dff">{</text>
  <text x="825" y="204" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="64" font-weight="700" fill="#4c8dff">}</text>

  <!-- the ball -->
  <g transform="translate(680,56)">
    <g>
        <clipPath id="ballclip"><circle r="16"/></clipPath><circle r="16" fill="#fbfbf6"/><g clip-path="url(#ballclip)"><path d="M1.65,-5.36 Q10.46,4.72 22.95,9.55 L23.87,4.15 Q11.38,-0.68 2.57,-10.76 Z" fill="#f5c518"/><path d="M4.25,4.86 Q-8.89,7.45 -19.32,15.85 L-15.10,19.34 Q-4.67,10.95 8.47,8.35 Z" fill="#1e5fbf"/><path d="M-5.90,2.00 Q-1.58,-10.67 -3.63,-23.90 L-8.77,-22.00 Q-6.71,-8.77 -11.03,3.91 Z" fill="#f5c518"/><path d="M0.00,0.50 Q4.32,-12.17 2.27,-25.40 M1.65,-5.36 Q10.46,4.72 22.95,9.55 M2.57,-10.76 Q11.38,-0.68 23.87,4.15 M0.00,0.50 Q8.81,10.58 21.30,15.41 M4.25,4.86 Q-8.89,7.45 -19.32,15.85 M8.47,8.35 Q-4.67,10.95 -15.10,19.34 M0.00,0.50 Q-13.13,3.09 -23.56,11.49 M-5.90,2.00 Q-1.58,-10.67 -3.63,-23.90 M-11.03,3.91 Q-6.71,-8.77 -8.77,-22.00" fill="none" stroke="#1b2a4a" stroke-width="1.1" stroke-linecap="round"/></g><circle r="16" fill="none" stroke="#1b2a4a" stroke-width="1.4000000000000001"/>
    </g>
