name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *" # once a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1e5fbf&color_dots=#ebedf0,#fde68a,#fcd34d,#f5b301,#d97706
            dist/github-snake-dark.svg?color_snake=#f5c518&color_dots=#161b22,#0e3a7a,#1e5fbf,#3b82f6,#93c5fd

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
